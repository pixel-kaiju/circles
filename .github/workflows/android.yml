name: Android CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем репозиторий (всегда выполняется в корне)
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Устанавливаем Java и кэшируем зависимости
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: gradle

    # 3. Выдаем права на запуск (указываем точный путь к файлу)
    - name: Grant execute permission for gradlew
      run: chmod +x ./android-apk/gradlew

    # 4. Запускаем сборку прямо внутри подпапки проекта
    - name: Build with Gradle
      working-directory: ./android-apk
      run: ./gradlew assembleDebug

    # 5. Вытаскиваем и сохраняем APK (ищем рекурсивно по всему репозиторию)
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
